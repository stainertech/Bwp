<!DOCTYPE html>
<html>
<head>
    <title>Account Verification</title>
    <!-- CSS styling goes here to make it look like a mobile app screen -->
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; text-align: center; }
        .login-box { max-width: 360px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; }
        .btn-submit { background-color: #ff6600; color: white; border: none; padding: 10px 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <!-- A real system would use secure, verified branding -->
    <h2>Quick Portal</h2>
    <p>Please log in to continue.</p>
    
    <form>
        <label>Mobile Number:</label><br>
        <input type="text" placeholder="e.g., 71234567"><br><br>
        
        <label>Account PIN:</label><br>
        <input type="password" placeholder="••••"><br><br>
        
        <button type="submit" class="btn-submit">Submit</button>
    </form>
</div>

</body>
</html>
