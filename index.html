<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #fff4eb, #f7f8fc, #e8eef8);
    display: flex;
    flex-direction: column;
}

.top-bar {
    min-height: 70px;
    padding: 18px 6%;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
}

.brand {
    color: #ff6600;
    font-size: 22px;
    font-weight: 800;
}

.status {
    color: #687386;
    font-size: 13px;
    font-weight: 700;
}

.main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 16px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    padding: 36px 28px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(26, 39, 65, .09);
    animation: appear .4s ease-out;
}

.icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff0e5;
    color: #ff6600;
    border-radius: 18px;
    font-size: 28px;
    font-weight: 800;
}

h1 {
    text-align: center;
    color: #172033;
    font-size: 27px;
    margin-bottom: 12px;
}

.description {
    text-align: center;
    color: #788195;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.field {
    margin-bottom: 21px;
}

label {
    display: block;
    color: #30394c;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 10px;
}

input {
    width: 100%;
    height: 54px;
    border: 1px solid #e0e5ed;
    border-radius: 12px;
    padding: 0 15px;
    background: #fafbfe;
    color: #172033;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff6600;
    box-shadow: 0 0 0 3px rgba(255, 102, 0, .1);
}

button {
    width: 100%;
    min-height: 54px;
    border: none;
    border-radius: 12px;
    background: #ff6600;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 5px;
}

button:hover {
    background: #e85b00;
}

.notice {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #f5f7fb;
    color: #697489;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
}

.footer {
    text-align: center;
    padding: 20px 12px;
    color: #8a93a3;
    font-size: 12px;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .top-bar { padding: 16px 18px; }
    .login-box { padding: 30px 22px; }
    h1 { font-size: 25px; }
}

@media (max-height: 650px) {
    .main { padding-top: 12px; padding-bottom: 12px; }
    .login-box { padding-top: 20px; padding-bottom: 20px; }
    .icon { width: 48px; height: 48px; margin-bottom: 14px; }
    .description { margin-bottom: 17px; }
    .field { margin-bottom: 14px; }
}
</style>
</head>

<body>
<header class="top-bar">
    <div class="brand">Quick Portal</div>
    <div class="status">Verification Desk</div>
</header>

<main class="main">
    <section class="login-box">
        <div class="icon" aria-hidden="true">Q</div>

        <h1>Account Verification</h1>
        <p class="description">
            Enter the details requested by your own application
            to explore this verification interface.
        </p>

        <form id="verificationForm">
            <div class="field">
                <label for="mobile">Enter your phone number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your phone number"
                    autocomplete="off"
                    required>
            </div>

            <div class="field">
                <label for="pin">PIN</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="Enter PIN"
                    autocomplete="off"
                    required>
            </div>

            <button type="submit">Continue to Verification</button>
        </form>

        <div class="notice" id="notice" role="status">
            Sample interface — no account information is transmitted.
        </div>
    </section>
</main>

<footer class="footer">
    Verification Website
</footer>

<script>
document.getElementById("verificationForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("notice").textContent =
        "Interface preview complete. No information was transmitted.";
});
</script>
</body>
</html>
