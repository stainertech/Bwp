<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(145deg, #fff4eb, #f7f8fc, #e8eef8);
    display: flex;
    flex-direction: column;
}

.top-bar {
    width: 100%;
    min-height: 70px;
    padding: 18px 6%;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
}

.brand {
    color: #ff6600;
    font-size: 22px;
    font-weight: 800;
}

.status {
    color: #687386;
    font-size: 13px;
    font-weight: 700;
}

.main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
}

.page {
    width: 100%;
    max-width: 430px;
    padding: 36px 28px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(26, 39, 65, .09);
    animation: appear .35s ease-out;
}

h1 {
    text-align: center;
    color: #172033;
    font-size: 27px;
    margin-bottom: 12px;
}

.description {
    text-align: center;
    color: #788195;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.field {
    margin-bottom: 21px;
}

label {
    display: block;
    color: #30394c;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 10px;
}

input {
    width: 100%;
    height: 54px;
    border: 1px solid #e0e5ed;
    border-radius: 12px;
    padding: 0 15px;
    background: #fafbfe;
    color: #172033;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff6600;
    box-shadow: 0 0 0 3px rgba(255, 102, 0, .1);
}

button {
    width: 100%;
    min-height: 54px;
    border: none;
    border-radius: 12px;
    background: #ff6600;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 5px;
}

button:hover {
    background: #e85b00;
}

.secondary {
    background: #eef1f6;
    color: #30394c;
    margin-top: 12px;
}

.secondary:hover {
    background: #e0e5ed;
}

.otp-input {
    text-align: center;
    letter-spacing: 10px;
    font-size: 24px;
    font-weight: 700;
}

.footer {
    text-align: center;
    padding: 20px 12px;
    color: #8a93a3;
    font-size: 12px;
}

.hidden {
    display: none;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    .top-bar {
        padding: 16px 18px;
    }

    .page {
        padding: 30px 22px;
        border-radius: 19px;
    }

    h1 {
        font-size: 25px;
    }
}

@media (max-height: 650px) {
    .main {
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .page {
        padding-top: 22px;
        padding-bottom: 22px;
    }

    .description {
        margin-bottom: 18px;
    }

    .field {
        margin-bottom: 14px;
    }
}
</style>
</head>

<body>

<header class="top-bar">
    <div class="brand">Quick Portal</div>
    <div class="status">Verification Desk</div>
</header>

<main class="main">

    <!-- PAGE ONE -->
    <section class="page" id="detailsPage">
        <h1>Account Verification</h1>

        <p class="description">
            Enter your details to continue.
        </p>

        <form id="detailsForm">
            <div class="field">
                <label for="mobile">Enter your phone number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your phone number"
                    autocomplete="on"
                    required="+263 with 8 digits always beginning with 7"
            </div>

            <div class="field">
                <label for="pin">PIN</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="Enter PIN"
                    autocomplete="on"
                    required="4 digits"
            </div>

            <button type="submit">
                Continue with Verification
            </button>
        </form>
    </section>

    <!-- PAGE TWO: OTP PROTOTYPE -->
    <section class="page hidden" id="otpPage">
        <h1>OTP Verification</h1>

        <p class="description">
            Enter a test verification code to preview this screen.
            Do not enter a real account security code.
        </p>

        <form id="otpForm">
            <div class="field">
                <label for="otp">Verification Code</label>
                <input
                    type="text"
                    id="otp"
                    class="otp-input"
                    placeholder="••••••"
                    inputmode="numeric"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="off"
                    required>
            </div>

            <button type="submit">
                Verify Code
            </button>

            <button type="button" class="secondary" id="backButton">
                Back
            </button>
        </form>

        <p id="result" class="description hidden"
           style="margin-top:20px; margin-bottom:0;">
        </p>
    </section>

</main>

<footer class="footer">
    Verification Website
</footer>

<script>
const detailsPage = document.getElementById("detailsPage");
const otpPage = document.getElementById("otpPage");

document.getElementById("detailsForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    // Navigate to the second screen without transmitting
    // or saving the phone number or PIN.
    detailsPage.classList.add("hidden");
    otpPage.classList.remove("hidden");
});

document.getElementById("backButton")
.addEventListener("click", function() {
    otpPage.classList.add("hidden");
    detailsPage.classList.remove("hidden");
});

document.getElementById("otpForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const result = document.getElementById("result");
    result.textContent =
        "Prototype complete. No verification code was transmitted.";
    result.classList.remove("hidden");
});
</script>

</body>
</html>
